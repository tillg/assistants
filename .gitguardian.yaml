# GitGuardian scan configuration.
#
# Two files in this repository contain credentials on purpose: the four development login
# passwords, which README.md publishes as the way to sign in and which the end-to-end tier has to
# agree with. They are weak deliberately and are safe only because every port binds to 127.0.0.1
# (D-023). A scanner flagging them is a true positive about a published fact, so the alert carries
# no information and hides the ones that would.
#
# Nothing else is scoped out. Every machine credential is generated by `just setup` into `.env`,
# which is gitignored, as are the three files `just render-secrets` produces from
# compose/keycloak/*.template.
#
# Scope: this file is read by ggshield -- pre-commit hooks and CI. It is NOT read by GitGuardian's
# GitHub integration, which is what sends the incident mail; those occurrences have to be resolved
# or ignored once in the dashboard.
version: 2

secret:
  ignored_paths:
    - .env.example
    - e2e/fixtures/users.json
