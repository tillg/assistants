# The passwords come from the environment, because they are generated per clone and live only in
# `.env` (D-023). Running this profile by hand therefore needs them exported first:
#
#     set -a; source .env; set +a
#     ./gradlew :server:app:bootRun --args='--spring.profiles.active=local-db-env'
#
# Spring fails at startup with "Could not resolve placeholder" if they are absent, which is the
# right outcome — the alternative is a connection refused with a misleading cause. Inside compose
# these entries are never read: SPRING_DATASOURCES_DATASERVICES_PASSWORD and friends set the same
# properties at higher precedence, so the placeholders below are not even resolved.

# Dataservices
spring.datasources.dataservices.username=assistants-ds-user
spring.datasources.dataservices.password=${DATASERVICES_PASSWORD}
## CONFIG: Compatible with gradle postgresComposeUp
spring.datasources.dataservices.url=jdbc:postgresql://localhost:8083/assistants-ds

# Contentstore
spring.datasources.contentstore.username=assistants-cs-user
spring.datasources.contentstore.password=${CONTENTSTORE_PASSWORD}
## CONFIG: Compatible with gradle postgresComposeUp
spring.datasources.contentstore.url=jdbc:postgresql://localhost:8083/assistants-cs

# CONFIG: Update search index
mgmtp.a12.dataservices.query.reindexing.mode=rebuild_index
