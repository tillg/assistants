services:
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: ${PROJECT_NAME}_frontend
    restart: unless-stopped
    environment:
      NGINX_ASSISTANTS_SERVER_BASE_URL: http://server:8080/api
      NGINX_ASSISTANTS_SERVER_ACTUATOR_URL: http://server:8080/actuator
      # The content store's download endpoint, proxied same-origin so the attachment preview can
      # `fetch` the bytes past CORS and the `Content-Disposition: attachment` header — see
      # client/nginx.conf.template. Served by the same process as /api.
      NGINX_ASSISTANTS_SERVER_CONTENTSTORE_URL: http://server:8080/cs
    ports:
      - 127.0.0.1:8081:8081
    depends_on:
      - "server"
    networks:
      - a12_compose

  server:
    image: ${SERVER_IMAGE}
    container_name: ${PROJECT_NAME}_server
    restart: unless-stopped
    environment:
      # `local-db-env`, NOT `dev-env`: the dev-env group transitively activates
      # dataservices-embedded_postgres + contentstore-embedded_postgres, and an embedded
      # Postgres beats an additionally-listed external one. Every Thing then lives in the
      # container's writable layer and dies with the container. local-db-env is the same
      # group with the external_postgres profiles instead; the datasource URLs below
      # override the localhost defaults the `local-db` profile ships with.
      SPRING_PROFILES_ACTIVE: local-db-env
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0

      SPRING_DATASOURCES_DATASERVICES_URL: jdbc:postgresql://postgres:5432/${DATASERVICES_DB}
      SPRING_DATASOURCES_DATASERVICES_USERNAME: ${DATASERVICES_USERNAME}
      SPRING_DATASOURCES_DATASERVICES_PASSWORD: ${DATASERVICES_PASSWORD}
      SPRING_DATASOURCES_CONTENTSTORE_URL: jdbc:postgresql://postgres:5432/${CONTENTSTORE_DB}
      SPRING_DATASOURCES_CONTENTSTORE_USERNAME: ${CONTENTSTORE_USERNAME}
      SPRING_DATASOURCES_CONTENTSTORE_PASSWORD: ${CONTENTSTORE_PASSWORD}
      SPRING_DATASOURCES_CONTENTSTORE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCES_CONTENTSTORE_JPA_DATABASE: postgresql
      SPRING_DATASOURCES_CONTENTSTORE_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      MGMTP_A12_DATASERVICES_CONTENTSTORE_BASE-URL: http://localhost:8082
      MGMTP_A12_DATASERVICES_QUERY_REINDEXING_MODE: rebuild_index
      MGMTP_A12_UAA_AUTHENTICATION_PRINCIPAL_ACCESS-RIGHTS-RESOURCE: file:/var/lib/a12/data/import/auth/roles.yaml
      MGMTP_A12_UAA_AUTHORIZATION_CHILD-AUTHORIZATION-DEFINITIONS: file:/var/lib/a12/data/import/auth/childAuthorizationDefinition.json
      MGMTP_A12_DATASERVICES_INITIALIZATION_IMPORT_MODELS_PATH: file:/var/lib/a12/data/models/
      MGMTP_A12_DATASERVICES_INITIALIZATION_SCRIPTS_JSONRPC_ENABLED: false

      # Keys are fetched over the internal address, but the `iss` claim is checked against the
      # public one, which is what the browser put in the token. Only the JWK set URI is
      # overridden here; `issuer-uri` stays at the public URL from application-dev.properties.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      MGMTP_A12_UAA_AUTHENTICATION_CLIENT-SELFCONFIGURATION_OIDC_PUBLIC-CLIENT_IDP-BASE_URL: ${KEYCLOAK_PUBLIC_URL}
      MGMTP_A12_UAA_AUTHENTICATION_CLIENT-SELFCONFIGURATION_OIDC_PUBLIC-CLIENT_REALM-NAME: ${KEYCLOAK_REALM}

      # The door outward (ADR-0023). This server holds no Firefly credential -- only the address of
      # the component that does, and the secret that lets it knock. The allowlist is deployment's
      # half of the gate; the Runtime holds the authoritative half in code.
      ASSISTANTS_RUNTIME_URL: http://runtime:8090
      ASSISTANTS_RUNTIME_SHARED-SECRET: ${RUNTIME_INBOUND_SECRET}
      ASSISTANTS_RUNTIME_ALLOWED-OPERATIONS: ${CLIENT_CALLABLE_OPERATIONS:-bookkeeping.listAccounts,bookkeeping.listTransactions}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      server-init:
        # when applying server-init profile, it must be completed successfully.
        # make sure you have docker compose version 2.20.2 or higher to use this feature.
        required: false
        condition: service_completed_successfully
    networks:
      - a12_compose
    ports:
      - 127.0.0.1:8082:8080
    volumes:
      # Read-only: roles.yaml and the models are inputs, never outputs.
      - ../import:/var/lib/a12/data/import:ro
      - ../build/wcf-output/data/models:/var/lib/a12/data/models
      #
      # NO firefly_token mount here, and that absence is load-bearing (ADR-0023).
      #
      # An earlier draft of this change put the Reader on this server, so the token was mounted for
      # it. The Reader moved to the Runtime and the mount stayed behind for a while — which meant the
      # credential that reaches the books was sitting inside the one container published to the host,
      # read by nothing. The server holds the Runtime's address and a shared secret, and there is no
      # code path from here to Firefly. Adding this mount back would be a regression, not a
      # convenience.

  server-init:
    image: ${SERVER_INIT_IMAGE}
    container_name: ${PROJECT_NAME}_server-init
    environment:
      # See the note on `server` -- dev-env would put the data in the container's writable layer.
      SPRING_PROFILES_ACTIVE: local-db-env
      SPRING_DATASOURCES_DATASERVICES_URL: jdbc:postgresql://postgres:5432/${DATASERVICES_DB}
      SPRING_DATASOURCES_DATASERVICES_USERNAME: ${DATASERVICES_USERNAME}
      SPRING_DATASOURCES_DATASERVICES_PASSWORD: ${DATASERVICES_PASSWORD}
      SPRING_DATASOURCES_CONTENTSTORE_URL: jdbc:postgresql://postgres:5432/${CONTENTSTORE_DB}
      SPRING_DATASOURCES_CONTENTSTORE_USERNAME: ${CONTENTSTORE_USERNAME}
      SPRING_DATASOURCES_CONTENTSTORE_PASSWORD: ${CONTENTSTORE_PASSWORD}
      SPRING_DATASOURCES_CONTENTSTORE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCES_CONTENTSTORE_JPA_DATABASE: postgresql
      SPRING_DATASOURCES_CONTENTSTORE_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      MGMTP_A12_DATASERVICES_INITIALIZATION_SCRIPTS_JSONRPC_PATHS: file:/var/lib/a12/data/import/data/request/*.json
      MGMTP_A12_DATASERVICES_INITIALIZATION_IMPORT_MODELS_PATH: file:/var/lib/a12/data/models/
    profiles:
      - server-init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - a12_compose
    volumes:
      # Read-only: roles.yaml and the models are inputs, never outputs.
      - ../import:/var/lib/a12/data/import:ro
      - ../build/wcf-output/data/models:/var/lib/a12/data/models

  postgres:
    image: ${DOCKER_REGISTRY_FOR_READ}/postgres:${POSTGRES_VERSION}
    container_name: ${PROJECT_NAME}_postgres
    restart: unless-stopped
    ports:
      - 127.0.0.1:8083:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASERVICES_USER: ${DATASERVICES_USERNAME}
      DATASERVICES_PASSWORD: ${DATASERVICES_PASSWORD}
      DATASERVICES_DB: ${DATASERVICES_DB}
      CONTENTSTORE_USER: ${CONTENTSTORE_USERNAME}
      CONTENTSTORE_PASSWORD: ${CONTENTSTORE_PASSWORD}
      CONTENTSTORE_DB: ${CONTENTSTORE_DB}
      FIREFLY_DB_USER: ${FIREFLY_DB_USERNAME}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
      FIREFLY_DB: ${FIREFLY_DB}
      KEYCLOAK_DATABASE_USER: ${KEYCLOAK_DATABASE_USER}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KEYCLOAK_DATABASE_DB: ${KEYCLOAK_DATABASE_DB}
    healthcheck:
      # Checks whether Postgres is ready.
      test:
        [
          "CMD-SHELL",
          "pg_isready --username assistants-ds-user --dbname assistants-ds && pg_isready --username assistants-cs-user --dbname assistants-cs && pg_isready --username assistants-firefly-user --dbname assistants-firefly && pg_isready --username assistants-keycloak-user --dbname assistants-keycloak",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/db-init.sh:/docker-entrypoint-initdb.d/db-init.sh
    networks:
      - a12_compose

  keycloak:
    # The identity provider for everything a human logs in to. This is the A12 Project
    # Template's own Keycloak set-up: realm A12Realm, public SPA client a12-spa-client, and
    # the realm roles the server maps to A12 access rights through import/auth/roles.yaml.
    #
    # KC_HOSTNAME pins the issuer to the browser-facing URL. Without it Keycloak derives the
    # issuer from the request host, so a token minted over the internal `keycloak:8080`
    # address would claim a different issuer than one minted through the browser -- and
    # exactly one of the two would then fail validation. oauth2-proxy redeems its
    # authorization code over the internal address, so this is not optional.
    #
    # `start-dev` and an unencrypted HTTP listener: this is a development stack on
    # 127.0.0.1 (D-013). A real deployment needs `start`, a hostname and TLS.
    image: ${KEYCLOAK_REGISTRY}/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: ${PROJECT_NAME:-assistants}_keycloak
    restart: unless-stopped
    env_file:
      - keycloak/keycloak.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DATABASE_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - 127.0.0.1:8089:8080
    volumes:
      # --import-realm reads every *-realm.json and its *-users-N.json siblings from here.
      # Import is create-only: once the realm exists in Postgres, editing these files changes
      # nothing until the volume is dropped. `just clean` is the way to reload them.
      - ./keycloak:/opt/keycloak/data/import:ro
      # The Assistants login theme, which the realm selects with `loginTheme`. Mounted rather
      # than baked into an image so editing the CSS is a `just restart keycloak`, not a
      # rebuild; `start-dev` disables the theme cache, so even that is usually a reload.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    command: ["start-dev", "--import-realm"]
    healthcheck:
      # KC_HEALTH_ENABLED puts /health/ready on the management port, 9000. The image ships no
      # curl and no wget, so the probe opens the socket with bash's /dev/tcp instead.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - a12_compose

  firefly:
    # Bookkeeping backend. Shares the stack's Postgres, in its own database with its own
    # role -- one database container for the whole stack, not two engines to operate.
    #
    # No published port: every browser request arrives through firefly-proxy on 8084, which
    # is what makes Keycloak the only place a password is ever typed. Firefly III has no OIDC
    # client of its own -- `remote_user_guard` is the whole of its support for an external
    # identity provider, and it trusts the header blindly, so reaching Firefly directly would
    # bypass authentication entirely. Inside the compose network `firefly:8080` is still open;
    # that is deliberate and is how the Runtime and firefly-bootstrap talk to it.
    image: fireflyiii/core:version-6.6.6
    container_name: ${PROJECT_NAME:-assistants}_firefly
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${FIREFLY_APP_KEY}
      APP_URL: http://localhost:8084 # must match the external URL
      SITE_OWNER: ${FIREFLY_EMAIL}
      TZ: Europe/Berlin
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${FIREFLY_DB}
      DB_USERNAME: ${FIREFLY_DB_USERNAME}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
      PGSQL_SCHEMA: public
      # Plain TCP inside the compose network; Postgres here has no server certificate.
      PGSQL_SSL_MODE: prefer
      MAIL_MAILER: log
      MAIL_FROM: noreply@example.com
      STATIC_CRON_TOKEN: ${FIREFLY_CRON_TOKEN} # must be EXACTLY 32 chars
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal

      # Authentication is somebody else's job. Firefly reads the identity out of a request
      # header and performs no check of its own -- no password, no MFA -- so the header must
      # be one only firefly-proxy can set, which is why this service publishes no port.
      # The name is the $_SERVER key, not the wire name: X-Forwarded-Email arrives in PHP as
      # HTTP_X_FORWARDED_EMAIL, and the guard looks it up verbatim.
      AUTHENTICATION_GUARD: remote_user_guard
      AUTHENTICATION_GUARD_HEADER: HTTP_X_FORWARDED_EMAIL
    volumes:
      # One narrow path -- never mount all of storage/. The books themselves live in
      # Postgres now, so storage/database is no longer a thing to persist.
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - a12_compose

  firefly-proxy:
    # oauth2-proxy: the only way into Firefly III from outside the compose network, and the
    # piece that makes Keycloak Firefly's identity provider. It runs the authorization-code
    # flow against Keycloak, then forwards the request to Firefly with X-Forwarded-Email set
    # to the address in the ID token -- which is the identity Firefly's remote_user_guard
    # trusts. Firefly itself has no OIDC support to configure.
    #
    # SKIP_OIDC_DISCOVERY, and every endpoint spelled out: the login URL has to be one the
    # *browser* can open (localhost:8089) while the token and JWKS URLs have to be ones this
    # container can reach (keycloak:8080). Discovery would return one set of URLs for both.
    # The issuer stays the public URL because KC_HOSTNAME makes Keycloak claim it either way.
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION}
    container_name: ${PROJECT_NAME:-assistants}_firefly-proxy
    restart: unless-stopped
    ports:
      - 127.0.0.1:8084:4180
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://firefly:8080
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      OAUTH2_PROXY_LOGIN_URL: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      OAUTH2_PROXY_CLIENT_ID: firefly-oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${FIREFLY_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8084/oauth2/callback
      # REQUIRED, not an enhancement. The realm client sets `pkce.code.challenge.method: S256`,
      # which makes Keycloak *demand* PKCE and answer an authorization request without it
      # `invalid_request: Missing parameter: code_challenge_method` — a 403 from the proxy, after
      # the redirect has already worked, so it only shows up if you follow the callback through.
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECRET: ${FIREFLY_PROXY_COOKIE_SECRET}
      # http, not https, so the session cookie cannot be Secure. Localhost only (D-013).
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      # Any user of this realm may log in; who they are is what matters, not their domain.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Straight to Keycloak instead of an interstitial "Sign in with..." page.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Firefly's REST API authenticates on its own `api` guard -- Passport, not the web guard
      # -- so the Runtime's personal access token is checked whether or not the proxy has a
      # session. Sending those requests through the OIDC dance would only break every client
      # that legitimately holds a token, so they pass straight through. Everything a *browser*
      # reaches is still behind Keycloak, which is the surface that matters.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/api/,^/healthcheck$$"
      # This is the whole point: it is what sets X-Forwarded-User and X-Forwarded-Email on
      # the request Firefly sees.
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      # Firefly does its own session handling behind the guard and has no use for the token.
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
    depends_on:
      keycloak:
        condition: service_healthy
      firefly:
        condition: service_healthy
    networks:
      - a12_compose

  firefly-bootstrap:
    # One-shot: mints a Personal Access Token into the firefly_token volume, where the
    # Runtime can read it. Idempotent -- re-running reuses a still-valid token.
    #
    # It reaches Firefly directly, sending the same X-Forwarded-Email header firefly-proxy
    # sets, because that is now the only way to be authenticated. No password is involved
    # anywhere: FIREFLY_EMAIL identifies the account, Keycloak holds the credential, and the
    # two must name the same user or the Runtime would keep books the human never sees.
    #
    # alpine/curl, not python:3.12-alpine + `apk add curl`: the script needs only sh, curl and
    # the busybox text tools, and installing curl at start-up made every `up` require the
    # internet. Offline this container exited non-zero and, because `runtime` waits for it with
    # service_completed_successfully, the Runtime never started at all.
    image: alpine/curl:latest
    container_name: ${PROJECT_NAME:-assistants}_firefly-bootstrap
    restart: "no"
    environment:
      BASE: http://firefly:8080
      FIREFLY_EMAIL: ${FIREFLY_EMAIL}
      TOKEN_FILE: /firefly-token/pat.txt
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec /bootstrap.sh"]
    volumes:
      - ./firefly/bootstrap.sh:/bootstrap.sh:ro
      - firefly_token:/firefly-token
    depends_on:
      firefly:
        condition: service_healthy
    networks:
      - a12_compose

  runtime:
    # The Runtime: trigger watcher + loop driver.
    #
    # EXACTLY ONE REPLICA. A12 has no compare-and-swap, so `leaseUntil` on a Conversation is
    # crash recovery, not mutual exclusion -- two replicas would both claim an expired lease.
    # This is a constraint of the design, not a deployment convenience.
    build:
      context: ../runtime
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-assistants}/runtime:${PROJECT_VERSION:-dev}
    container_name: ${PROJECT_NAME:-assistants}_runtime
    restart: unless-stopped
    # Docker's default is 10s, and a clean stop here is routinely longer than that.
    #
    # SIGTERM sets a flag the scan loop reads *between* passes, so what actually ends the process is
    # the current pass finishing. Six seconds was the measured norm before the letterbox; a mail poll
    # can add an IMAP round trip and a large attachment on top of it. At 10s the container was being
    # SIGKILLed mid-pass — possibly mid-upload — and the log ended with "finishing the current scan
    # and stopping" and no "runtime stopped", which reads exactly like a hang rather than a timeout.
    #
    # Sixty is not a target. It is the ceiling before something is genuinely wedged, and reaching it
    # is worth investigating rather than waiting out.
    stop_grace_period: 60s
    # Stated, not merely implied by container_name: `--scale runtime=3` must fail on the
    # constraint above, not on an incidental name clash whose error suggests removing the name.
    scale: 1
    deploy:
      replicas: 1
    # The whole of `.env`, not a list of names, and that is what makes named LLM profiles work:
    # each profile in `llm.json` reads its key from a variable named after it (AZURE_GPT_KEY for
    # `azure_gpt`), so adding a profile must not mean editing this file too. Nothing here can
    # enumerate a name nobody has invented yet.
    #
    # The cost is that the Runtime container also sees the rest of `.env` -- the database and
    # Keycloak credentials it has no use for. Accepted: this is a single-household stack whose
    # every port binds to 127.0.0.1, and the alternative is a second secrets file that D-023
    # exists to prevent. `environment:` below still wins over anything of the same name here.
    env_file:
      - ../.env
    environment:
      THINGSTORE_URL: http://server:8080
      THINGSTORE_USER: runtime
      # From .env, not a literal: the same value is rendered into the realm's `runtime` user
      # (A12Realm-users-0.json.template), so a literal here would keep the old password while
      # Keycloak got the new one -- a Runtime that fails only at its first authenticated call.
      THINGSTORE_PASSWORD: ${RUNTIME_PASSWORD}

      # The Runtime is headless, so it gets its token from Keycloak with the direct access
      # grant rather than a browser redirect -- hence its own client, which is the only one
      # in the realm with that grant enabled. The internal address is right here: the server
      # validates the `iss` claim against the public URL, and KC_HOSTNAME makes Keycloak use
      # the public URL in the claim no matter which address the token was requested over.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: assistants-runtime-client

      FIREFLY_URL: http://firefly:8080
      FIREFLY_TOKEN_FILE: /run/firefly/pat.txt
      UI_BASE_URL: http://localhost:8081

      # Which model the Assistants talk to is `active` in ../llm.json, mounted below -- not a
      # variable here. The profile it ships active is `scripted`, which keeps the stack free and
      # deterministic, and that is what lets the end-to-end tier drive the REAL Runtime,
      # ThingStore, Firefly and UI. Change `active` there and `just restart runtime`.
      LLM_CONFIG_FILE: /app/llm.json

      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-2000}
      # Every Schedule Trigger's cron is read in this timezone and resolved to a UTC instant before
      # that instant becomes the schedule's identity (ADR-0016).
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # The door outward (ADR-0023): a read-only route the server forwards a client's question to,
      # because the Runtime is the only component that can reach an External System.
      #
      # Deliberately NOT under `ports:` -- this service still publishes nothing to the host, and
      # container-to-container traffic on this network needs neither `ports` nor `expose`. The
      # boundary that faces the world stays Keycloak, at the server.
      INBOUND_PORT: ${RUNTIME_INBOUND_PORT:-8090}
      INBOUND_SECRET: ${RUNTIME_INBOUND_SECRET}
      CLIENT_CALLABLE_OPERATIONS: ${CLIENT_CALLABLE_OPERATIONS:-bookkeeping.listAccounts,bookkeeping.listTransactions}
    volumes:
      - firefly_token:/run/firefly:ro
      - ../runtime/fixtures:/run/fixtures:ro
      # Mounted rather than baked into the image: switching model is editing one line and
      # restarting, not rebuilding. Read-only -- the Runtime never writes it.
      - ../llm.json:/app/llm.json:ro
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_healthy
      firefly-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # A stale heartbeat is the only visible symptom of a wedged watcher: the terminal-failure
      # path writes an Open Question, but that write shares fate with whatever broke. So the
      # health of this service is "did the last scan finish", not "is the process alive".
      test: ["CMD", "node", "dist/src/health.js"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s
    networks:
      - a12_compose

networks:
  a12_compose:
    driver: bridge

volumes:
  postgres_data:
  firefly_upload:
  firefly_token:
