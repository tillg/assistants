# The Assistants login theme.
#
# parent=base, not parent=keycloak: the `keycloak`/`keycloak.v2` themes ship PatternFly, and
# every A12 value below would have to be won back from it one `!important` at a time. `base`
# supplies the same FreeMarker templates with no stylesheet at all and no class names --
# every class an element carries is one of the names declared here. So this theme owns its
# whole class vocabulary and Keycloak owns the markup, which is what keeps a Keycloak upgrade
# from being a redesign. No template is overridden.
#
# The values in css/assistants.css are the A12 design tokens read out of the running
# application (see the header of that file), so the login screen and the application it
# guards are the same product to look at.

parent=base

styles=css/assistants.css

# English only, matching the application: the client ships en and de bundles, but the realm
# has internationalization off, so Keycloak never renders the switcher. Listing just `en`
# keeps the two from disagreeing if it is ever turned on.
locales=en

